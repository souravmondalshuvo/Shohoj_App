name: shohoj
description: University life, made simple — BRAC University academic tools.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  google_sign_in: ^6.2.1

  # Worker API calls (review submission)
  http: ^1.2.0

  # Transcript import: PDF text extraction and file selection.
  # pdfrx is MIT and PDFium-backed. Deliberately not syncfusion_flutter_pdf,
  # which is the usual choice and ships under a Community/commercial licence
  # that would make this MIT app non-redistributable under its own terms.
  pdfrx: ^2.4.7
  file_picker: ^11.0.3

  # Injectable time source so the sync layer is testable under fakeAsync
  clock: ^1.1.2

  # State management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App launcher icons, generated from the shared Shohoj mark.
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Deliberately no adaptive_icon_foreground/background. The mark already has
  # its own rounded-square background; supplying it as an adaptive foreground
  # makes Android shrink the whole thing into the 66% safe zone and composite a
  # second background around it. The legacy icon lets Android mask the artwork
  # directly, which is what the mark was drawn for.

